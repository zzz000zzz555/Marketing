<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hover Effects — Showcase</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <h1>Hover Effects</h1>
    <section class="grid">
      <div class="card lift">Lift</div>
      <div class="card glow">Glow</div>
      <div class="card border-reveal">Border Reveal</div>
      <div class="card content-shift"><span>Content Shift</span><button class="cta">Ver más</button></div>
      <button class="btn fill-sweep">Fill Sweep</button>
      <button class="btn ripple-btn">Ripple</button>
      <button class="btn underline-grow">Underline Grow</button>
      <a class="link sliding-underline">Sliding Underline</a>
      <a class="link bg-highlight">Background Highlight</a>
      <div class="img-wrap zoom-pan"><img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" alt="img"></div>
      <div class="img-wrap overlay-fade"><img src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=400&q=80" alt="img"><div class="overlay">Ver producto</div></div>
      <div class="img-wrap grayscale"><img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=400&q=80" alt="img"></div>
    </section>
  </main>
</body>
</html>
