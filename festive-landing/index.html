<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festive Landing — Liquid Glass</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>

  <main>
    <section class="hero">
      <div class="glass-card hero-card">
        <span class="badge">🎄 NAVIDAD</span>
        <h1>Felices Fiestas</h1>
        <p>Celebra la temporada con ofertas especiales y un ambiente mágico.</p>
        <button class="glass-btn">Ver ofertas</button>
      </div>
    </section>

    <section class="features">
      <div class="glass-card">
        <h3>Envío gratis</h3>
        <p>En pedidos mayores a S/ 250 a todo el Perú.</p>
      </div>
      <div class="glass-card">
        <h3>Devoluciones fáciles</h3>
        <p>30 días para cambios y devoluciones.</p>
      </div>
      <div class="glass-card">
        <h3>Compra segura</h3>
        <p>Pagos tokenizados y protegidos.</p>
      </div>
    </section>
  </main>

  <div class="music-control" id="musicControl">
    <button class="music-btn" id="musicBtn" aria-label="Reproducir música ambiental" aria-pressed="false" type="button">
      <span class="wave" aria-hidden="true"></span>
      <span class="wave" aria-hidden="true"></span>
      <span class="wave" aria-hidden="true"></span>
      <i aria-hidden="true">♪</i>
    </button>
    <label class="music-volume">
      <span class="sr-only">Volumen de la música</span>
      <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.4" aria-label="Volumen de la música ambiental">
    </label>
  </div>

  <audio id="ambientAudio" loop preload="auto">
    <source src="assets/audio/navidad-ambient.wav" type="audio/wav">
  </audio>

  <script src="js/festive.js"></script>
</body>
</html>
